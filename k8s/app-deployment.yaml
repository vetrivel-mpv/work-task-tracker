apiVersion: apps/v1
kind: Deployment
metadata:
  name: northstar-app
  labels:
    app.kubernetes.io/name: northstar-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: northstar-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northstar-app
    spec:
      containers:
        - name: app
          image: northstar-delivery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: POSTGRES_DB_URL
              value: "postgres://postgres:postgrespassword@postgres:5432/acm_jira"
            - name: HASURA_GRAPHQL_ENDPOINT
              value: "http://hasura:8080/v1/graphql"
            - name: HASURA_ADMIN_SECRET
              value: "adminsecretkey"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: northstar-app
  labels:
    app.kubernetes.io/name: northstar-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: northstar-app
